services:
  sbm-agent-tooling:
    image: sbm-agent-tooling:1.0.0

    build:
      context: ./agents/tooling/generator
      dockerfile: Dockerfile

    working_dir: /workspace/context/agents

    environment:
      TOOLING_IMAGE: sbm-agent-tooling
      TOOLING_VERSION: "1.0.0"

    volumes:
      - ./agents:/workspace/context/agents

    tmpfs:
      - /tmp

    user: "10001:10001"

    stdin_open: true
    tty: true

    network_mode: bridge
