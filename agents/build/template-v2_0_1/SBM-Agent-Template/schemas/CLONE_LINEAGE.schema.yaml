$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  clone_lineage_id: &id001
    type: string
    minLength: 1
  agent_id: *id001
  agent_version: *id001
  is_clone:
    type: boolean
  clone_id:
    oneOf:
    - type: 'null'
    - *id001
  parent_agent_id:
    oneOf:
    - type: 'null'
    - *id001
  parent_agent_version:
    oneOf:
    - type: 'null'
    - *id001
  parent_spec_id:
    oneOf:
    - type: 'null'
    - *id001
  parent_spec_version:
    oneOf:
    - type: 'null'
    - *id001
required:
- clone_lineage_id
- agent_id
- agent_version
- is_clone
- clone_id
- parent_agent_id
- parent_agent_version
- parent_spec_id
- parent_spec_version
additionalProperties: false
allOf:
- if:
    properties:
      is_clone:
        const: false
  then:
    properties:
      clone_id:
        type: 'null'
      parent_agent_id:
        type: 'null'
      parent_agent_version:
        type: 'null'
      parent_spec_id:
        type: 'null'
      parent_spec_version:
        type: 'null'
- if:
    properties:
      is_clone:
        const: true
  then:
    properties:
      clone_id: *id001
      parent_agent_id: *id001
      parent_agent_version: *id001
      parent_spec_id: *id001
      parent_spec_version: *id001
